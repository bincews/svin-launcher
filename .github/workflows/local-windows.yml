name: Build Svin Launcher for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BUILD_PLATFORM: svin-local
      ARTIFACT_NAME: Windows-MSVC-Qt6
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup dependencies using upstream build recipe
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.11.2
      - name: Configure
        shell: pwsh
        env:
          LOCAL_CURSEFORGE_API_KEY: ${{ secrets.LOCAL_CURSEFORGE_API_KEY }}
          LOCAL_MSA_CLIENT_ID: ${{ vars.LOCAL_MSA_CLIENT_ID }}
        run: |
          cmake --preset ci "-DVCPKG_HOST_TRIPLET=$env:VCPKG_TRIPLET" "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" "-DLauncher_CURSEFORGE_API_KEY=$env:LOCAL_CURSEFORGE_API_KEY" "-DLauncher_MSA_CLIENT_ID=$env:LOCAL_MSA_CLIENT_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile
        run: cmake --build --preset ci --config Release
      - name: Test
        shell: pwsh
        run: |
          ctest --preset ci --build-config Release --exclude-regex '^FileSystem$' --timeout 120 --output-junit build/Svin-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Join-Path $PWD 'build/FileSystem-local.txt'
          $test = Start-Process -FilePath (Join-Path $PWD 'build/Release/LauncherTests.exe') -ArgumentList @('FileSystem_test', 'test_pathCombine', 'test_PathCombine1', 'test_PathCombine2', 'test_copy', 'test_copy_with_blacklist', 'test_copy_with_whitelist', 'test_copy_with_dot_hidden', 'test_copy_single_file', 'test_getDesktop', 'test_hard_link', 'test_path_depth', 'test_path_trunc', '-o', "$report,txt") -WindowStyle Hidden -PassThru -Wait
          Get-Content -LiteralPath $report
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Install portable build
        shell: pwsh
        run: |
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --config Release --component portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LOCAL-FORK.md, LICENSE, COPYING.md -Destination install
          Copy-Item program_info/SVIN-BRANDING.md -Destination install
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          if (-not (Test-Path -LiteralPath $crt)) { throw "Microsoft Runtime directory not found: $crt" }
          Get-ChildItem -LiteralPath $crt -Filter '*.dll' | Copy-Item -Destination install
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Svin-test-results
          path: |
            build/Svin-tests.xml
            build/FileSystem-local.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: Svin-Launcher-Windows-x64-portable
          path: install/
          if-no-files-found: error
