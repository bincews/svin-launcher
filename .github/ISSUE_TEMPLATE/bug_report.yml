name: Svin Launcher bug report
description: Report a bug
body:
  - type: input
    id: version
    attributes:
      label: Svin Launcher version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What happened, and how can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message or launch log
      render: text
