name: Ошибка Svin Launcher
description: Сообщить об ошибке
body:
  - type: input
    id: version
    attributes:
      label: Версия Svin Launcher
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Версия Windows
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку
      description: Что произошло и как это повторить?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Сообщение об ошибке или журнал запуска
      render: text
